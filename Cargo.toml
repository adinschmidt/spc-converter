[package]
name = "spc_converter"
version = "0.1.3"
edition = "2021"
description = "Convert Spectrum Analyzer Suite .spc files to JSON/CSV"
license = "MIT"
repository = "https://github.com/adinschmidt/spc-converter"
keywords = ["spc", "spectroscopy", "spectrum", "converter", "cli"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
plotters = "0.3"
